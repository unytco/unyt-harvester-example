name: Rehearse

# The whole flow on a private local HoloFuel network: production unyt.happ,
# random network seed, real conductor. Public downloads only, no secrets.
on:
  workflow_dispatch: {}
  pull_request:
    paths: ["src/**", "rehearsal/**", "config/**", "package*.json"]

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .rehearsal/bin
          key: rehearsal-bin-${{ hashFiles('rehearsal/fetch.sh') }}
      - run: npm ci
      - run: npm run rehearse -- --clean
